name: Build, Push to ECR & Fast Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 439855819034.dkr.ecr.ap-southeast-1.amazonaws.com
  EC2_INSTANCE_ID: i-042a4bc873688c582

jobs:
  build-and-deploy:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scl-sandbox-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scl-sandbox-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Fast Deploy on EC2 via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Fast Deploy from GitHub Actions ECR" \
            --parameters 'commands=["cd /opt/app/repo && git pull origin main && bash AWS/deploy_ec2.sh"]' \
            --region ${{ env.AWS_REGION }}
