name: CI/CD — Test, Build, Push ECR & Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 010596578619.dkr.ecr.ap-southeast-2.amazonaws.com
  APP_URL: http://54.252.146.170
  ASG_TAG_KEY: aws:autoscaling:groupName
  ASG_TAG_VALUE: scl-sandbox-asg

# JOB 1: Test & Lint (backend Go + frontend TypeScript)
jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --- Backend (Go) ---
      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Go Lint (vet)
        working-directory: ./backend
        run: go vet ./...

      - name: Go Build Check
        working-directory: ./backend
        run: go build ./...

      # --- Frontend (Next.js) ---
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Frontend TypeScript Check
        working-directory: ./frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Frontend Lint
        working-directory: ./frontend
        run: npm run lint -- --max-warnings=0 || true

# JOB 2: Build & Push Docker images to ECR
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and Push Backend Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/scl-sandbox-backend:latest
            ${{ env.ECR_REGISTRY }}/scl-sandbox-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/scl-sandbox-frontend:latest
            ${{ env.ECR_REGISTRY }}/scl-sandbox-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ======================================================
# JOB 3: Deploy to EC2 via AWS SSM (ASG-aware)
# ======================================================
  deploy:
    name: Deploy to EC2 (ASG)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ALL instances in Auto Scaling Group
        run: |
          # ดึง instance IDs จาก ASG tag
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:${{ env.ASG_TAG_KEY }},Values=${{ env.ASG_TAG_VALUE }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text | tr '\t\n' ',' | sed 's/,$//')

          # Fallback: ถ้า ASG tag หาไม่เจอ ใช้ instance ปัจจุบัน (ap-southeast-2)
          if [ -z "$INSTANCE_IDS" ]; then
            echo "ASG tag not found, falling back to known instance ID"
            INSTANCE_IDS="i-060d20577c1068c1e"
          fi

          echo "Deploying to instances: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }} from GitHub Actions" \
            --parameters 'commands=["cd /opt/app/repo && git fetch origin && git reset --hard origin/main && bash AWS/scripts/deploy_ec2.sh 2>&1"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for SSM command to complete
        run: |
          echo "Waiting for deploy to finish..."
          sleep 45

          # ดู output จริงจาก instance
          aws ssm list-command-invocations \
            --command-id $COMMAND_ID \
            --region ${{ env.AWS_REGION }} \
            --details \
            --query "CommandInvocations[*].{Status:Status,Output:CommandPlugins[0].Output}" \
            --output table || true

          STATUS=$(aws ssm list-command-invocations \
            --command-id $COMMAND_ID \
            --region ${{ env.AWS_REGION }} \
            --query "CommandInvocations[*].Status" \
            --output text)

          echo "Deploy status: $STATUS"

          if echo "$STATUS" | grep -qiE "Failed|TimedOut|Cancelled"; then
            echo "Deploy FAILED on one or more instances!"
            exit 1
          fi
          echo "Deploy completed successfully"

# JOB 4: Health Check หลัง deploy
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for services to be ready
        run: sleep 20

      - name: Check Frontend (Login page)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "${{ env.APP_URL }}/login")
          echo "Frontend HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Frontend health check FAILED (status: $HTTP_STATUS)"
            exit 1
          fi
          echo "Frontend is healthy"

      - name: Check Backend API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "${{ env.APP_URL }}/api/health")
          echo "Backend HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "401" ]; then
            echo "Backend health check FAILED (status: $HTTP_STATUS)"
            exit 1
          fi
          echo "Backend is healthy"

      - name: Deployment Summary
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "URL: ${{ env.APP_URL }}"
