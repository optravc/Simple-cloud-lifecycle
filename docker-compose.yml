name: Simple-Cloud-Lifecycle

services:
  # ==============================
  # 1. ส่วนของ Backend (Go)
  # ==============================
  backend-api:
    image: 439855819034.dkr.ecr.ap-southeast-1.amazonaws.com/scl-sandbox-backend:latest
    container_name: lifecycle_backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8000"         
    restart: always

  # ==============================
  # 2. ส่วนของ Frontend (Next.js)
  # ==============================
  frontend-web:
    image: 439855819034.dkr.ecr.ap-southeast-1.amazonaws.com/scl-sandbox-frontend:latest
    container_name: lifecycle_frontend
    ports:
      - "3000:3000"       
    depends_on:
      - backend-api        
    restart: always