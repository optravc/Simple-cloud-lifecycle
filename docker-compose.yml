name: Simple-Cloud-Lifecycle

services:
  # ==============================
  # 1. Database (PostgreSQL 16) - แทนที่ RDS ประหยัด $43/เดือน
  # ==============================
  postgres:
    image: postgres:16-alpine
    container_name: lifecycle_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-optra}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-optra} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scl-network

  # ==============================
  # 2. Reverse Proxy (Nginx) 
  # ==============================
  nginx:
    image: nginx:alpine
    container_name: lifecycle_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend-web
    networks:
      - scl-network

  # ==============================
  # 3. Backend API (Go 1.24)
  # ==============================
  backend-api:
    build: ./backend
    image: 010596578619.dkr.ecr.ap-southeast-2.amazonaws.com/scl-sandbox-backend:latest
    container_name: lifecycle_backend
    restart: always
    environment:
      - AWS_REGION=ap-southeast-2
      - PORT=8000
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scl-network

  # ==============================
  # 4. Frontend Web (Next.js 15)
  # ==============================
  frontend-web:
    build: ./frontend
    image: 010596578619.dkr.ecr.ap-southeast-2.amazonaws.com/scl-sandbox-frontend:latest
    container_name: lifecycle_frontend
    restart: always
    depends_on:
      - backend-api
    networks:
      - scl-network

volumes:
  pgdata:

networks:
  scl-network:
    driver: bridge