name: Simple-Cloud-Lifecycle

services:
  # ==============================
  # 1. ส่วนของ Backend (Go)
  # ==============================
  backend-api:
    image: simple-cloud-lifecycle-backend:latest
    build: 
      context: ./backend    
      dockerfile: Dockerfile 
    container_name: lifecycle_backend
    ports:
      - "8080:8000"         
    restart: always

  # ==============================
  # 2. ส่วนของ Frontend (Next.js)
  # ==============================
  frontend-web:
    image: simple-cloud-lifecycle-frontend:latest
    build:
      context: ./frontend   
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_AWS_REGION=${NEXT_PUBLIC_AWS_REGION:-ap-southeast-1}
        - NEXT_PUBLIC_COGNITO_USER_POOL_ID=${NEXT_PUBLIC_COGNITO_USER_POOL_ID:-ap-southeast-1_ZXVLGZxhZ}
        - NEXT_PUBLIC_COGNITO_CLIENT_ID=${NEXT_PUBLIC_COGNITO_CLIENT_ID:-6l698lageen7c6ogkbeo6lj1ve}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: lifecycle_frontend
    ports:
      - "3000:3000"       
    depends_on:
      - backend-api        
    restart: always